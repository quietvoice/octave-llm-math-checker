[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-check-mcp"
version = "0.1.0"
description = "MCP server that deterministically checks math claims as RIGHT or WRONG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Curioforce Corporation" }]
dependencies = ["mcp>=1.9,<2"]

[project.optional-dependencies]
x402 = ["x402>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
math-check-mcp = "math_check_mcp.server:main"
math-check = "math_check_mcp.checker:main"

[tool.setuptools.packages.find]
include = ["math_check_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
